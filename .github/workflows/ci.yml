name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: cd devops-project/app && python -m unittest -v
      - name: Build Docker image
        run: docker build -f devops-project/docker/Dockerfile -t devops-app:ci devops-project
