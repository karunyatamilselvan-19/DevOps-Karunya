apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app
  labels: {app: devops-app}
spec:
  replicas: 2
  selector:
    matchLabels: {app: devops-app}
  template:
    metadata:
      labels: {app: devops-app}
    spec:
      containers:
        - name: app
          image: youruser/devops-app:latest
          ports:
            - containerPort: 8080
          env:
            - {name: APP_ENV, value: base}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
